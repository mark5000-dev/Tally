services:
  postgres:
    image: postgres:17-alpine
    container_name: tally-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally_local_only
    ports:
      - "5432:5432"
    volumes:
      - tally-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tally-postgres-data:
